services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app 
      POSTGRES_PASSWORD: app 
      POSTGRES_DB: shop 
    ports:
      - "5432:5432"
    volumes:
      - ../../migrations:/docker-entrypoint-initdb.d:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s 
      timeout: 2s 
      retries: 10 

